# TEST split. Run only after: (1) revision pinned in the model config, (2) a dev run produced thresholds.json,
# (3) the dev findings are reviewed. Edit thresholds_file to the dev run's path. Every run is logged to results/test_access_log.jsonl.
name: pope_style_blip2_test
task: pope_style
model:
  from_file: configs/models/blip2_opt_2p7b.yaml
dataset:
  root: data/coco
  split: val2017
  split_seed: 0
  our_split: test
  n_images: 1000
  seed: 1
probe:
  templates:
    - "Is there {a_obj} in the image?"
    - "Does this image contain {a_obj}?"
    - "Can you see {a_obj} in this picture?"
  blind_baseline: true
  thresholds_file: results/REPLACE_WITH_DEV_RUN_DIR/thresholds.json
output:
  top_k_failures: 50
